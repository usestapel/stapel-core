name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[all]" || pip install -e .

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: emit-check (outbox atomicity gate)
        run: python lint/emit_check.py .

      - name: realtime-check (the realtime border, stapel-realtime-design §2.3)
        run: python lint/realtime_check.py .

      - name: migration-lint (expand/contract gate, release-management.md §3)
        run: |
          pip install "stapel-tools>=0.24.0,<1" --quiet
          stapel-migration-lint . --strict

      - name: Import check
        run: python -c "import stapel_core; print('import OK')"

      - name: Install test dependencies
        # .[dev] brings pytest/pytest-cov + celery (the optional executor the
        # tests exercise); phonenumbers is a declared runtime dependency now.
        # stapel-tools (dependency-free) carries the capabilities emitter that
        # tests/test_contract.py drift-gates — without it that gate would skip,
        # and a silently skipped gate is how docs/capabilities.json rots.
        #
        # -e, and it is load-bearing: without it this step installs a SECOND,
        # non-editable copy of the repo into site-packages, which then shadows
        # the editable install from the step above and is what the suite
        # imports. The run would report on a copy of the tree rather than the
        # tree — the very thing stapel-tools' freshness gate (0.68.0+) exists
        # to refuse, and it duly refused this job the day that release landed.
        run: pip install -e ".[dev]" pytest-django "stapel-tools>=0.22.0,<1"

      - name: Tests with coverage
        run: |
          pytest tests/ \
            --cov=stapel_core \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-core
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The concurrency gate. SQLite `:memory:` gives every connection its own
  # database, so two writers never meet and the first-contact INSERT race
  # cannot be reproduced there. It is reproduced here, against a real server:
  # two threads, two connections, one mirrored user row.
  concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: stapel
          POSTGRES_DB: core_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" pytest-django "psycopg[binary]"
      - name: First-contact race against Postgres
        env:
          STAPEL_TEST_DATABASE_URL: postgres://postgres:stapel@127.0.0.1:5432/core_test
        # The suite asserts the variable was honoured, so this job cannot go
        # green by quietly running on SQLite.
        run: pytest tests/test_first_contact_insert_race.py tests/test_jwt_shadow_rekey.py tests/test_ensure_shadow_user.py -q -v
