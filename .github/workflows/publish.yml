name: Publish to PyPI
on:
  push:
    tags: ["v*"]

jobs:
  # Releases are cut from main only. A tag on a side branch can publish a
  # higher version that does not contain a lower one's fix — 0.60.2 did
  # exactly that to 0.60.1 — and nothing downstream would go red. Runs
  # before anything is built. See release-check.sh.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the gate needs full history and every v* tag

      - name: release-check (on main, and contains every published tag)
        run: |
          # Belt and braces: the gate is an error, not a skip, without a
          # main ref to compare against, so make sure one is there.
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          make release-check

  test:
    needs: release-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[all]" || pip install -e .

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: emit-check (outbox atomicity gate)
        run: python lint/emit_check.py .

      - name: realtime-check (the realtime border, stapel-realtime-design §2.3)
        run: python lint/realtime_check.py .

      - name: Import check
        run: python -c "import stapel_core; print('import OK')"

      - name: Install test dependencies
        # .[dev] brings pytest/pytest-cov + celery (the optional executor the
        # tests exercise); phonenumbers is a declared runtime dependency now.
        run: pip install ".[dev]" pytest-django "stapel-tools>=0.22.0,<1"

      - name: Tests with coverage
        run: |
          pytest tests/ \
            --cov=stapel_core \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-core
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build --quiet
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
