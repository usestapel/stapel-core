[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-core"
version = "0.51.0"
description = "Core Django utilities for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "auth", "jwt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    # Upper bound, not a whim: Django 6.1 removed the private
    # `django.utils.cache.cc_delim_re` that `rest_framework/views.py` still
    # imports (checked against DRF 3.17.2 on 2026-08-07). Any DRF import
    # breaks at collection time on Django 6.1 — this is what broke the
    # stapel-tools 0.29.1 publish (green locally on 6.0, CI installs latest).
    # REMOVE once DRF drops this import.
    "Django>=5.1,<6.1",
    "djangorestframework>=3.14",
    "djangorestframework-dataclasses>=1.2",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.3",
    "django-redis>=5.4",
    "PyJWT>=2.8",
    "cryptography>=41.0",
    "requests>=2.31",
    "phonenumbers>=8.13",
    # Payload validation for the comm layer (STAPEL_COMM["VALIDATE_SCHEMAS"],
    # on by default). It used to be an optional extra because validation was
    # best-effort; a default-on security control has to be installable by
    # default, or the default configuration is one that cannot run.
    "jsonschema>=4.18",
]

[project.optional-dependencies]
kafka = [
    "confluent-kafka>=2.3",
]
nats = [
    # filter_subjects in ConsumerConfig needs nats-py 2.9+ (server 2.10+)
    "nats-py>=2.9",
]
# Redis Streams bus backend (stapel_core.bus.backends.redis_streams).
# django-redis already pulls in redis-py transitively for the cache backend,
# but transitivity is not a contract — declare it explicitly so a deployment
# that swaps the cache backend doesn't silently lose the bus transport too.
redis-bus = [
    "redis>=5",
]
sentry = [
    "sentry-sdk>=1.40",
]
# Prometheus metrics backend (stapel_core.observability, the METRICS_BACKEND
# default). Absent, the backend degrades to a no-op that says so via check
# stapel_core.observability.W002 — never an ImportError at request time.
prometheus = [
    "prometheus-client>=0.19",
]
# MaxMindProvider (stapel_core.netintel) — offline GeoLite2/GeoIP2 lookups
netintel-maxmind = [
    "geoip2>=4.7",
]
# Privilege gateway (stapel_core.gateway) — mandatory verb-args validation
gateway = [
    "jsonschema>=4.18",
]
# Channels JWT auth (stapel_core.django.jwt.channels) — WebSocket/ASGI
# authentication over the same jwt_provider used by the HTTP stack.
channels = [
    "channels>=4.0",
]
# PIL media backend (stapel_core.media, BACKEND="pil") — variant generation
# and render-metadata over a plain Django ImageField, no CDN service needed.
media = [
    "Pillow>=9.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # celery executor is an optional runtime path (guarded import in
    # comm/tasks.py); the test suite exercises that branch.
    "celery>=5.3",
    # in-memory Redis for the Streams bus backend tests — real XADD/
    # XREADGROUP/XACK/XAUTOCLAIM semantics without a running server.
    "fakeredis>=2.20",
    # the DEFAULT metrics backend; without it the observability suite would
    # only ever exercise the degraded no-op path of the backend every
    # deployment gets out of the box.
    "prometheus-client>=0.19",
]
all = [
    "stapel-core[kafka,nats,redis-bus,sentry,prometheus,netintel-maxmind,gateway,channels]",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-core"
Repository = "https://github.com/usestapel/stapel-core"
Documentation = "https://github.com/usestapel/stapel-core#readme"
Changelog = "https://github.com/usestapel/stapel-core/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-core/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
source = ["stapel_core"]
omit = [
    # Kafka/bus infrastructure — requires running Kafka broker
    "*/bus/_config.py",
    "*/bus/backends/kafka.py",
    "*/kafka/*",
    # AppConfig — no logic
    "*/django/apps.py",
    # Users admin — trivial Django admin registration
    "*/django/users/admin.py",
    # JWT provider top-level shim — re-export, tested via the real module
    "*/django/jwt_provider.py",
    # Per-service settings module — wired per deployment, not package-testable
    "*/django/settings.py",
    # Management commands — run via CLI, tested at service level
    "*/management/commands/reset_sequences.py",
    "*/management/commands/staff_group.py",
    # External service integrations — require running services
    "*/django/workspaces.py",
    "*/notifications/*",
    # GDPR export/delete over the bus — needs a running service to exercise.
    # Only that half: gdpr/owners.py (the erasure-owner subscriber) is
    # measured like any other seam.
    "*/gdpr/__init__.py",
    # Language utilities — tested at service level
    "*/core/language.py",
    # Migrations — auto-generated
    "*/migrations/*",
    # Test helper itself
    "*/testing.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.setuptools]
package-dir = {"stapel_core" = "."}
packages = [
    "stapel_core",
    "stapel_core.access",
    "stapel_core.bus",
    "stapel_core.bus.backends",
    "stapel_core.captcha",
    "stapel_core.core",
    "stapel_core.django",
    "stapel_core.django.jwt",
    "stapel_core.django.sites",
    "stapel_core.django.api",
    "stapel_core.django.cdn",
    "stapel_core.django.monitoring",
    "stapel_core.django.admin",
    "stapel_core.django.openapi",
    "stapel_core.django.management",
    "stapel_core.django.management.commands",
    "stapel_core.django.users",
    "stapel_core.django.users.migrations",
    "stapel_core.django.outbox",
    "stapel_core.django.outbox.migrations",
    "stapel_core.django.outbox.management",
    "stapel_core.django.outbox.management.commands",
    "stapel_core.django.taskstore",
    "stapel_core.django.taskstore.migrations",
    "stapel_core.django.taskstore.management",
    "stapel_core.django.taskstore.management.commands",
    "stapel_core.django.projections",
    "stapel_core.django.projections.migrations",
    "stapel_core.django.projections.management",
    "stapel_core.django.projections.management.commands",
    "stapel_core.django.eventstore",
    "stapel_core.django.eventstore.migrations",
    "stapel_core.django.eventstore.management",
    "stapel_core.django.eventstore.management.commands",
    "stapel_core.django.gateway",
    "stapel_core.django.gateway.migrations",
    "stapel_core.gateway",
    "stapel_core.gdpr",
    "stapel_core.eventstore",
    "stapel_core.eventstore.backends",
    "stapel_core.comm",
    "stapel_core.config",
    "stapel_core.media",
    "stapel_core.flows",
    "stapel_core.i18n",
    "stapel_core.lint",
    "stapel_core.net",
    "stapel_core.netintel",
    "stapel_core.observability",
    "stapel_core.secrets",
    "stapel_core.security",
    "stapel_core.verification",
    "stapel_core.kafka",
    "stapel_core.notifications",
]

[tool.setuptools.package-data]
# `django/translations/*.json` is load-bearing at RUNTIME, not just for docs:
# it is the catalog `load_app_catalogs` merges for core's cross-cutting error
# keys, and the file every module's gate reads to answer "does the owner ship
# this language". Left out of the wheel, core's texts silently vanish from
# every deployment and the fleet's modules go back to needing their own copies.
"stapel_core" = ["migrations/*.py", "django/templates/**/*", "django/translations/*.json", "static/**/*", "py.typed", "notifications/schemas/**/*.json", "CONFIG.MD", "PRESENTERS.MD", "docs/capabilities.json", "docs/llms.txt", "docs/flows.json", "docs/errors.json"]
